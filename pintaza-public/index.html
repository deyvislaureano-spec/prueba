enta</small><b class="ok">6,918</b></div></div>`+table(['Producto','S','M','L','XL','Disponible'],[`<tr><td><b>Clásico 30/1 · Negro</b></td><td>365</td><td>689</td><td>602</td><td>335</td><td><b>1,991</b></td></tr>`,`<tr><td><b>Clásico 30/1 · Blanco</b></td><td>188</td><td>145</td><td>211</td><td>96</td><td><b>640</b></td></tr>`])}</script><script>function sales(){return head('Ventas y pedidos','La vendedora registra la venta, reserva stock y confirma el envío.',`<button class="btn yellow" onclick="openModal('sale')">+ Nueva venta</button>`)+`<div class="sales"><div>${table(['','Pedido','Cliente','Producto','Entrega','Cobro','Estado'],SALES.map(o=>`<tr data-order="${o[0]}"><td><input class="order" type="checkbox" onchange="countSel()"></td><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td><td>${o[4]}</td><td class="st">${tag('Listo para enviar','yellow')}</td></tr>`))}</div><div class="card asidecard"><span class="tag blue">Integración logística</span><h3>Enviar a AndoCourier</h3><div class="big" id="sel">0</div><div class="sub">pedidos seleccionados</div><button class="btn dark" style="width:100%" onclick="sendAndo()">Confirmar envío →</button><div class="alert green" style="margin-top:9px"><b>Datos automáticos</b><span>Cliente, celular, dirección, distrito, ubicación, monto y detalle del pedido.</span></div><div class="route">PINTAZA → API → ANDOCOURIER<br>POST /orders<br>← tracking_code + status</div></div></div>`}function shipping(){return head('Despachos','AndoCourier responde estados al mismo sistema Pintaza.',`<button class="btn" onclick="toast('Estados actualizados · demo')">↻ Actualizar</button>`)+table(['Pedido Pintaza','Código AndoCourier','Cliente','Distrito','Contraentrega','Estado'],[`<tr><td><b>PV-1043</b></td><td>ANDO-682411</td><td>María Soto</td><td>Miraflores</td><td>S/ 100</td><td>${tag('En ruta','blue')}</td></tr>`,`<tr><td><b>PV-1041</b></td><td>ANDO-682395</td><td>Joel Cárdenas</td><td>San Borja</td><td>Pagado</td><td>${tag('Entregado','green')}</td></tr>`])}function api(){return head('Integraciones / API','Contrato propuesto: el prototipo simula la conexión; la versión final usará credenciales reales.',`<button class="btn" onclick="testApi()">Probar conexión</button>`)+`<div class="integration"><div class="card connect"><div class="connecthead"><div class="brandline"><div class="sq">A</div><div><h3>AndoCourier</h3><p>Logística · contraentrega · seguimiento</p></div></div><span id="apist" class="tag green">Demo activa</span></div><div class="sub">Endpoint propuesto para implementación</div><div class="code">POST https://api.andocourier.pe/v1/orders<br>Authorization: Bearer ••••••••••</div><div class="map"><div>pedido.codigo</div><div class="arrow">→</div><div>external_id</div><div>cliente.nombre</div><div class="arrow">→</div><div>recipient.name</div><div>cliente.celular</div><div class="arrow">→</div><div>recipient.phone</div><div>entrega.direccion</div><div class="arrow">→</div><div>address</div><div>cobro.contraentrega</div><div class="arrow">→</div><div>amount_to_collect</div></div></div><div class="card connect"><h3>Actualización automática</h3><p>Webhooks propuestos para devolver estados al sistema.</p><div class="alert green"><b>shipment.status.updated</b><span>En ruta / Entregado / No entregado.</span></div><div class="alert green"><b>shipment.delivery.evidence</b><span>Evidencia vinculada al pedido.</span></div><div class="alert green"><b>shipment.cod.settled</b><span>Contraentrega conciliada.</span></div></div></div>`}function users(){return head('Usuarios y permisos','El dueño controla todo; Ventas y Producción ven únicamente lo necesario.',`<button class="btn yellow" onclick="openModal('user')">+ Crear usuario</button>`)+`<div class="rolecards"><div class="card rolecard"><h3>Administrador / Dueño</h3><p>Costos, producción, inventario, ventas, reportes, usuarios e integraciones.</p>${tag('Acceso total','green')}</div><div class="card rolecard"><h3>Producción / Almacén</h3><p>Tela, corte, confección, recepción y ajustes autorizados.</p>${tag('Operativo','blue')}</div><div class="card rolecard"><h3>Ventas</h3><p>Clientes, pedidos, stock disponible y confirmación a AndoCourier.</p>${tag('Comercial','yellow')}</div></div>`}function generic(id){if(id==='customers')return head('Clientes','Historial, frecuencia de compra y datos de entrega.')+table(['Cliente','Celular','Pedidos','Comprado','Segmento'],[`<tr><td><b>Andrea Salazar</b></td><td>987 442 130</td><td>8</td><td>S/ 1,460</td><td>${tag('Recurrente','green')}</td></tr>`,`<tr><td><b>Luis Mendoza</b></td><td>944 731 090</td><td>16</td><td>S/ 4,820</td><td>${tag('Mayorista','blue')}</td></tr>`]);if(id==='trace')return head('Trazabilidad','OP-0268 · recorrido completo')+`<div class="grid2"><div class="card panel"><div class="alert green"><b>TL-1094 · tela registrada</b><span>214 m · 17 sep</span></div><div class="alert green"><b>Corte confirmado</b><span>988 piezas · rendimiento 98.8%</span></div><div class="alert green"><b>En confección</b><span>Taller Ramírez · 701 / 988</span></div></div><div class="card panel"><h2>Reglas</h2><div class="sub">El sistema no permite perder el origen ni crear stock sin respaldo.</div></div></div>`;return head('Reportes','Indicadores para tomar decisiones.')+`<div class="rolecards"><div class="card rolecard"><h3>Merma global</h3><p>2.8% · meta ≤ 3.5%</p></div><div class="card rolecard"><h3>Mejor taller</h3><p>Flores · 97.4/100</p></div><div class="card rolecard"><h3>Costo real promedio</h3><p>S/ 8.42 por prenda</p></div></div>`}function render(id){return id==='home'?home():id==='production'?production():id==='materials'?materials():id==='workshops'?workshops():id==='quality'?quality():id==='stock'?stock():id==='sales'?sales():id==='shipping'?shipping():id==='api'?api():id==='users'?users():generic(id)}function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function countSel(){const n=$('.order:checked').length;if($('#sel'))$('#sel').textContent=n}function sendAndo(){const c=$('.order:checked');if(!c.length)return toast('Selecciona uno o más pedidos');c.forEach((x,i)=>{x.disabled=true;x.checked=false;x.closest('tr').querySelector('.st').innerHTML=tag('Enviado a AndoCourier','green')});countSel();toast(c.length+' pedido(s) enviados a AndoCourier · demo')}function testApi(){if($('#apist'))$('#apist').textContent='Conexión verificada';toast('Respuesta API correcta · simulación')}function changeRole(v){go(v==='sales'?'sales':v==='prod'?'production':'home');toast('Vista de '+(v==='sales'?'Ventas':v==='prod'?'Producción':'Administrador')+' activada')}function openModal(k){const m={fabric:['Registrar tela recibida',[['Proveedor','Textiles Lima'],['Tipo de tela','Jersey polialgodón 30/1'],['Color','Negro'],['Metros recibidos','200']]],prod:['Nueva producción',[['Producto','Polo clásico 30/1'],['Color','Negro'],['Cantidad','1000'],['Lote de tela','TL-1108']]],work:['Enviar a confección',[['Producción','OP-0270'],['Taller','Taller Ramírez'],['Piezas que salen','706'],['Fecha prometida','26/09/2026']]],receive:['Recibir producción',[['Producción','OP-0268'],['Cantidad que regresó','988'],['Aprobadas','970'],['Para corrección','18']]],sale:['Registrar nueva venta',[['Cliente','Nombre completo'],['Celular','999 999 999'],['Producto','Polo clásico 30/1'],['Cantidad','10'],['Distrito','Surco'],['Monto a cobrar','S/ 100']]],user:['Crear usuario',[['Nombre',''],['Correo',''],['Rol','Ventas'],['Estado','Activo']]]};const d=m[k]||m.sale;$('#modalTitle').textContent=d[0];$('#modalBody').innerHTML=d[1].map(x=>`<div class="field"><label>${x[0]}</label><input value="${x[1]}"></div>`).join('');$('#modal').classList.add('open')}function quickAdd(){openModal(current==='materials'?'fabric':current==='production'?'prod':current==='workshops'?'work':current==='quality'?'receive':current==='users'?'user':'sale')}function closeModal(){$('#modal').classList.remove('open')}function saveModal(){closeModal();toast('Registro guardado en el prototipo')}nav();go('home');</script></body></html>
